[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmwitness"
version = "0.1.0"
description = "Local-first telemetry and tamper-evident receipts for AI-agent runs"
readme = "README.md"
authors = [
    { name = "LLMWitness maintainers" }
]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
# Minimums are the oldest releases with no known advisories at the time of
# writing; re-check them with `pip-audit` when raising or relaxing a bound.
dependencies = [
    "fastapi>=0.134.0",
    "starlette>=1.3.1",
    "uvicorn>=0.22.0",
    "cryptography>=50.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.10.0"
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3.0"
]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.80.0",
    "build>=0.10.0",
    "twine>=4.0.2",
    "mypy>=1.5.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "coverage>=7.0.0"
]

[project.urls]
Homepage = "https://github.com/FliorcieLabs/LLMWitness"
Repository = "https://github.com/FliorcieLabs/LLMWitness.git"
Issues = "https://github.com/FliorcieLabs/LLMWitness/issues"

[project.scripts]
llmwitness = "llmwitness.cli:main"

[tool.setuptools]
packages = ["llmwitness"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
