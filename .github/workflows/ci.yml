name: LLMWitness CI Matrix & Code Quality

on:
  push:
    branches: [ main, integ ]
  pull_request:
    branches: [ main, integ ]

jobs:
  lint-and-format:
    name: Code Style & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest

      - name: Check Formatting with Black
        run: |
          black --check llmwitness tests examples benchmarks

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type Check with Mypy
        run: |
          mypy --config-file pyproject.toml llmwitness

  test-matrix:
    name: Pytest Matrix (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: lint-and-format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: '3.10' }
          - { os: ubuntu-latest, python-version: '3.11' }
          - { os: ubuntu-latest, python-version: '3.12' }
          - { os: ubuntu-latest, python-version: '3.13' }
          - { os: ubuntu-latest, python-version: '3.14' }
          - { os: macos-latest, python-version: '3.11' }
          - { os: windows-latest, python-version: '3.11' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e . pytest coverage hypothesis

      - name: Run Test Suite
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.11'
        run: pytest tests/ -v

      - name: Run Test Suite with Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          coverage run -m pytest tests/ -v
          coverage report -m

      - name: Validate Packaging & Twine Check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
